<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Máquinas y Equipos MVV · Check list</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#15202b;--mut:#5d6b79;--line:#dce3ea;--pri:#0f5b4f;--pri2:#e3f1ee;--ok:#1b7f3a;--okbg:#e5f4ea;--bad:#c0261f;--badbg:#fde8e6;--warn:#a85d00;--warnbg:#fff2dc;--info:#1d5fa8;--infobg:#e6effa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;margin:0;flex:1;font-weight:650}
header small{display:block;font-weight:400;opacity:.8;font-size:12px}
header button{background:transparent;border:1px solid #ffffff70;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:650;cursor:pointer;margin-top:12px;background:var(--pri);color:#fff}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;margin:0;font-size:14px}
.big{font-size:20px;padding:22px}
.home .btn{text-align:left;padding:20px}
.home .btn span{display:block;font-weight:400;font-size:14px;opacity:.85;margin-top:2px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.itxt{margin-bottom:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.tag.crit{background:var(--badbg);color:var(--bad)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on[data-v="OK"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on[data-v="X"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on[data-v="N/A"]{background:#6b7280;border-color:#6b7280;color:#fff}
.obs{margin-top:8px}
.hide{display:none!important}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px;color:var(--ink)}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
.banner{border-radius:14px;padding:20px;text-align:center;margin-bottom:14px}
.banner b{display:block;font-size:24px;margin-bottom:4px}
.banner.ok{background:var(--okbg);color:var(--ok)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.warn{background:var(--warnbg);color:var(--warn)}
ul.fallas{margin:8px 0 0;padding-left:20px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--infobg);color:var(--info)}.b-mut{background:#eef1f4;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px}
.kpi span{font-size:12px;color:var(--mut)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.eq{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.eq .meta,.rec .meta{font-size:13px;color:var(--mut);margin-top:2px}
.eq.dis{opacity:.55;cursor:default}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.rec .top{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.rec .det{margin-top:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.rec .det p{margin:4px 0}
.alert{background:var(--badbg);border:1px solid #f3b8b3;color:var(--bad);border-radius:12px;padding:12px;margin-bottom:14px;font-size:15px}
.pend{background:var(--warnbg);border:1px solid #f2d39d;color:var(--warn);border-radius:12px;padding:12px;margin-bottom:14px;font-size:15px}
.note{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#eef1f4;border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#15202b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.demo{background:#fff8d6;color:#6b5400;font-size:13px;text-align:center;padding:6px}
.foot{text-align:center;font-size:12px;color:var(--mut);margin:20px 0}
.pick{max-height:360px;overflow:auto;margin-top:8px}
.eq.sel{border-color:var(--pri);background:var(--pri2);cursor:default}
.tmp{color:var(--info)!important}.venc{color:var(--bad)!important;font-weight:600}
.inv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inv .btn{margin-top:0;text-align:left}.inv .btn span{display:block;font-weight:400;font-size:13px;opacity:.85}
.qrlink{word-break:break-all;background:#eef1f4;border-radius:8px;padding:10px;font-size:14px;margin:8px 0}
.tag.en{background:#fff4d1;color:#8a6100}
.grp{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const uid = p => p + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
function lunes(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function semanaDe(fecha){ const [y,m,d]=fecha.split('-').map(Number); return ymd(lunes(new Date(y,m-1,d))); } // id de semana = fecha del lunes
function rangoSemana(lun){ const [y,m,d]=lun.split('-').map(Number); const a=new Date(y,m-1,d), b=new Date(y,m-1,d+6); return `${pad(a.getDate())}/${pad(a.getMonth()+1)} al ${pad(b.getDate())}/${pad(b.getMonth()+1)}`; }

function toast(m,ms=2800){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }

/* ---------------- API ---------------- */
const post = p => fetch(CONFIG.API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
const api = {
  async send(payload){
    if (DEMO){
      const db = ls.get('mvvmaq_demo', []);
      if (payload.action==='create') db.push({...payload.record, registrado: ahora()});
      if (payload.action==='validar') db.forEach(r=>{ if(payload.ids.includes(r.id)){ r.validadoPor=payload.validador; r.fechaValidacion=ahora(); }});
      ls.set('mvvmaq_demo', db); return true;
    }
    try{ await post(payload); return true; }
    catch(e){ const q=ls.get('mvvmaq_cola',[]); q.push(payload); ls.set('mvvmaq_cola',q); toast('Sin señal: quedó guardado y se envía cuando vuelva la conexión',4000); return false; }
  },
  async flush(){
    if (DEMO) return;
    const q=ls.get('mvvmaq_cola',[]); if(!q.length) return; const rest=[];
    for(const p of q){ try{ await post(p); }catch(e){ rest.push(p); } }
    ls.set('mvvmaq_cola',rest);
    if(q.length>rest.length) toast(`Se enviaron ${q.length-rest.length} registro(s) pendientes`);
  },
  async get(params){
    const u = CONFIG.API_URL + '?' + new URLSearchParams({...params, t:Date.now()});
    const j = await (await fetch(u)).json();
    if(!j.ok) throw new Error(j.error||'Error al leer datos');
    return j.data;
  },
  async equipos(){
    if (DEMO) return EQUIPOS_BASE;
    try{ const e=await api.get({action:'equipos'}); ls.set('mvvmaq_eqcache',e); return e; }
    catch(err){ return ls.get('mvvmaq_eqcache', EQUIPOS_BASE); }
  },
  async sitios(){
    if (DEMO) return SITIOS_FB;
    try{ const s=(await api.get({action:'sitios'})).map(x=>({...x, srv:x.alias})); if(s.length){ ls.set('mvvmaq_sitios',s); return s; } }catch(err){}
    return ls.get('mvvmaq_sitios', SITIOS_FB);
  },
  async registros(key, desde, hasta){
    if (DEMO){ if(key!==CONFIG.DEMO_PIN) throw new Error('PIN incorrecto'); return ls.get('mvvmaq_demo',[]).filter(r=>r.fecha>=desde&&r.fecha<=hasta); }
    return api.get({action:'list', key, desde, hasta});
  },
  async estado(){
    if (DEMO) return calcEstado(EQUIPOS_BASE, ls.get('mvvmaq_demo',[]));
    try{ return await api.get({action:'estado'}); } catch(e){ return {}; }

/* Frecuencia, check list y energía por equipo */
const esCheck = r => /^CHECK/.test((r&&r.tipo)||'');
const esElec = e => !!e && e.g==='Electrónico';
const freqDe = e => esElec(e) && !/^ALTA/i.test(e.crit||'') ? 'mensual' : 'semanal';
const listaDe = e => esElec(e) ? CONFIG.ELECTRONICO : CONFIG;
const mesDeSemana = lun => { const [y,m,d]=lun.split('-').map(Number); return ymd(new Date(y,m-1,d+3)).slice(0,7); };
const enPeriodo = (e, fecha, lun) => freqDe(e)==='semanal' ? semanaDe(String(fecha).slice(0,10))===lun : String(fecha).slice(0,7)===mesDeSemana(lun);
const num = v => { const n=parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:0; };
const kwhMes = e => num(e.pot)*num(e.h)*num(e.dm)*(num(e.fc)||1)/1000;
const ENER_T = CONFIG.ELECTRONICO.MENORES.filter(i=>i.en).map(i=>i.t);

/* Estado actual por equipo a partir del historial (misma lógica que el Apps Script) */
function calcEstado(equipos, regs){
  const st={};
  equipos.forEach(e=>{ st[e.id] = /REPAR/i.test(e.est) ? {estado:'NO APTO', desde:'', motivo:'Inventario: '+e.est} : {estado:'APTO', desde:'', motivo:''}; });
  [...regs].sort((a,b)=>a.fechaHora.localeCompare(b.fechaHora)).forEach(r=>{
    const s = st[r.equipoId] || (st[r.equipoId]={});
    if(esCheck(r)){ s.estado=r.resultado; s.desde=r.fechaHora; s.motivo=(r.fallasCriticas||[]).map(f=>f.item).join(', '); s.ultimoCheck=r.fecha; }
    if(r.tipo==='REPORTE DE FALLA'){ s.estado='NO APTO'; s.desde=r.fechaHora; s.motivo=r.falla; }
    if(r.tipo==='LIBERACIÓN'){ s.estado='APTO'; s.desde=r.fechaHora; s.motivo=''; }
  });
  return st;
}

  catch(e){ toast(e.message); pKey=''; return panel(); }

function panelRender(){
  const eqF = EQ.filter(e=>!pSup||e.sup===pSup);
  const ids = new Set(eqF.map(e=>e.id));
  const regs = pData.filter(r=>ids.has(r.equipoId) || (ADMIN_T.includes(r.tipo) && (!pSup || r.supervisor===pSup || r.supDesde===pSup))).sort((a,b)=>b.fechaHora.localeCompare(a.fechaHora));
  const temps = eqF.filter(e=>e.base).sort((a,b)=>String(a.ret||'9').localeCompare(String(b.ret||'9')));
  const regSem = regs.filter(r=>r.semana===pSem || semanaDe(r.fecha)===pSem);
  const hecho = e => pData.some(r=>esCheck(r)&&r.equipoId===e.id&&enPeriodo(e,r.fecha,pSem));
  const noApto = eqF.filter(e=>(ST[e.id]||{}).estado==='NO APTO');
  const activos = eqF.filter(e=>!noApto.includes(e));
  const conCheck = new Set(activos.filter(hecho).map(e=>e.id));
  const pendientes = activos.filter(e=>!conCheck.has(e.id));
  const cumpl = activos.length ? Math.round(100*activos.filter(e=>conCheck.has(e.id)).length/activos.length) : 0;
  const sinValidar = regs.filter(r=>esCheck(r) && !r.validadoPor);
  const fallasSem = regSem.filter(r=>r.resultado==='NO APTO').length;
  // fallas repetidas: 2+ NO APTO en 120 días
  const cnt={}; regs.filter(r=>r.resultado==='NO APTO').forEach(r=>cnt[r.equipoId]=(cnt[r.equipoId]||0)+1);
  const repetidas = Object.entries(cnt).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]);
  // cumplimiento por supervisor y servicio
  const porSup={}; EQ.filter(e=>(ST[e.id]||{}).estado!=='NO APTO').forEach(e=>{ const k=e.sup; porSup[k]=porSup[k]||{t:0,c:0}; porSup[k].t++; if(hecho(e)) porSup[k].c++; });
  const sups=[...new Set(EQ.map(e=>e.sup))].sort();
  const semanas=[]; { let l=new Date(pSem+'T00:00:00'); const act=lunes(new Date()); for(let i=0;i<12;i++){ const x=new Date(act); x.setDate(x.getDate()-7*i); semanas.push(ymd(x)); } }
  // ISO 50001: consumo estimado y buenas prácticas energéticas · ISO 55001: recambio por vida útil
  const elec = eqF.filter(e=>num(e.pot)>0);
  const enGrp={}; elec.forEach(e=>{ const k=e.maq; enGrp[k]=enGrp[k]||{n:0,w:0,kwh:0}; enGrp[k].n++; enGrp[k].w+=num(e.pot); enGrp[k].kwh+=kwhMes(e); });
  const enTot = Object.values(enGrp).reduce((a,v)=>a+v.kwh,0);

async function validar(ids){
  const inp=$('#pVal'); const v=(inp&&inp.value.trim())||ls.get('mvvmaq_validador','');
  if(!v){ toast('Escribí tu nombre en “Validado por”'); if(inp) inp.focus(); return; }
  ls.set('mvvmaq_validador',v);
  await api.send({action:'validar', key:pKey, ids, validador:v});
  const t=ahora(); pData.forEach(r=>{ if(ids.includes(r.id)){ r.validadoPor=v; r.fechaValidacion=t; }});
  toast(`${ids.length} check(s) validado(s)`); panelRender();
}
function exportarCSV(){
  const cols=['id','tipo','fecha','semana','equipo','maquina','servicio','supervisor','referente','resultado','fallas_criticas','observaciones','falla','trabajo','reparo','libero','validado_por','detalle'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const j=l=>(l||[]).map(f=>f.item+': '+f.obs).join(' | ');
  const rows=pData.map(r=>[r.id,r.tipo,r.fecha,r.semana,r.equipoId,r.maquina,r.servicio,r.supervisor,r.referente,r.resultado,j(r.fallasCriticas),j(r.observaciones),r.falla,r.trabajo,r.reparo,r.libero,r.validadoPor,r.obsGenerales].map(q).join(';'));
  const blob=new Blob(['﻿'+cols.join(';')+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${CONFIG.CODIGO}_${hoy()}.csv`; a.click();
}

const ADMIN_T = ['ALTA','TRASLADO','RETORNO','BAJA'];

function optSitios(excluirSrv){
  const g={};

function baseAdm(tipo, e){
  const quien=$('#fQuien').value.trim(); ls.set('mvvmaq_validador', quien);
  const f=hoy(), pre={ALTA:'AL',TRASLADO:'TR',RETORNO:'RT',BAJA:'BJ'}[tipo];
  return {id:uid(pre), tipo, fecha:f, semana:semanaDe(f), fechaHora:ahora(), referente:quien,
    equipoId:e?e.id:'', maquina:e?e.maq:'', modelo:e?e.mod:'', servicio:e?e.srv:'', supervisor:e?e.sup:''};
}
/* El POST va en modo no-cors (no se ve la respuesta): se confirma releyendo equipos y sitios */
async function adminEnviar(action, record, verificar){
  if(DEMO){ toast('En modo demo el inventario no se puede modificar'); return false; }
  if(!pKey){ toast('Ingresá al Panel con el PIN'); go('panel'); return false; }
  if(!navigator.onLine){ toast('Necesitás conexión para modificar el inventario'); return false; }
  const btn=$('#btnGo'), txt=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  const fin=v=>{ if(!v && btn){ btn.disabled=false; btn.textContent=txt; } return v; };
  try{ await post({action, key:pKey, record}); }catch(e){ toast('No se pudo enviar. Probá de nuevo.'); return fin(false); }
  for(let i=1;i<=4;i++){
    await new Promise(r=>setTimeout(r, 900*i));
    try{ [EQ, SITIOS] = await Promise.all([api.equipos(), api.sitios()]); const v=verificar(); if(v) return v; }catch(e){}
  }
  toast('No se pudo confirmar el cambio. Revisá el PIN y la conexión, y volvé a abrir el Panel antes de reintentar.', 6000);
  return fin(false);
}

async function enviarTraslado(){
  const e=window._eq, modo=window._modo, sit=$('#tSit').value, ret=$('#tRet').value, mot=$('#tMot').value.trim();
  if(!sit||!mot||!$('#fQuien').value.trim()) return toast('Completá sitio destino, motivo y quién registra');
  if(modo==='TEMPORAL' && !ret) return toast('Indicá la fecha de retorno prevista');
  const s=sitioCod(sit);
  const rec={...baseAdm('TRASLADO',e), modo, sitioCod:sit, destino:s.nombre, retorno:modo==='TEMPORAL'?ret:'', motivo:mot};
  const x = await adminEnviar('traslado', rec, ()=>{ const y=eqById(e.id); return y && s.srv.includes(y.srv) && y; });
  if(!x) return;
  okFin(`TRASLADO ${modo}`, `${esc(x.maq)} · ${esc(x.id)}`,
    `<div class="card"><p>${esc(e.srv)} → <b>${esc(x.srv)}</b> · Sup.: ${esc(x.sup)}</p>${tempTxt(x)}</div>
     <button class="btn sec" onclick="go('traslado')">Trasladar otro equipo</button>`);
}

/* ----- RETORNO (de un traslado temporal) ----- */
function retorno(e){
  if(!e) return elegirEquipo('↩️ Retorno · Equipos en traslado temporal', EQ.filter(x=>x.base), 'retorno', 'No hay equipos en traslado temporal.');
  app.innerHTML=`<div class="card"><h2>↩️ Retorno a su sitio</h2><div class="eq sel"><div>${fichaEq(e)}</div></div>
    <p>Vuelve de <b>${esc(e.srv)}</b> a <b>${esc(e.base)}</b>.</p>
    <label>Observaciones (opcional)</label><textarea id="rObs"></textarea>
    ${quienInput()}
    <button class="btn big" id="btnGo" onclick="enviarRetorno()">Registrar retorno</button>
    <button class="btn ghost" onclick="panelVolver()">Volver al panel</button></div>`;
  window._eq=e;
}
async function enviarRetorno(){
  const e=window._eq;
  if(!$('#fQuien').value.trim()) return toast('Completá quién registra');
  const rec={...baseAdm('RETORNO',e), obs:$('#rObs').value.trim()};
  const x = await adminEnviar('retorno', rec, ()=>{ const y=eqById(e.id); return y && !y.base && y; });
  if(!x) return;
  okFin('EQUIPO DE VUELTA EN SU SITIO', `${esc(x.maq)} · ${esc(x.id)} · ${esc(x.srv)}`);
}

/* ----- BAJA ----- */
function baja(e){
  if(!e) return elegirEquipo('🗑️ Baja · Elegí el equipo', EQ, 'baja', 'No hay equipos.');
  app.innerHTML=`<div class="card"><h2>🗑️ Baja de equipo</h2><div class="eq sel"><div>${fichaEq(e)}</div>${badge((ST[e.id]||{estado:'APTO'}).estado)}</div>
    <label>Motivo de la baja</label><select id="bMot"><option value="">Elegí…</option><option>Rotura: reparación no conveniente</option><option>Fin de vida útil / obsolescencia</option><option>Robo o pérdida</option><option>Venta o devolución</option><option>Otro</option></select>
    <label>Destino del equipo (opcional)</label><input id="bDes" placeholder="Ej.: chatarra, desarme para repuestos, devuelto al cliente…">
    <label>Observaciones (opcional)</label><textarea id="bObs"></textarea>
    ${quienInput()}
    <label class="check"><input type="checkbox" id="bConf"> Confirmo la baja: el equipo sale del inventario y del check de equipos. Su historial queda guardado.</label>
    <button class="btn bad big" id="btnGo" onclick="enviarBaja()">Dar de baja</button>
    <button class="btn ghost" onclick="go('baja')">Elegir otro equipo</button></div>`;
  window._eq=e;
}
async function enviarBaja(){
  const e=window._eq, mot=$('#bMot').value;
  if(!mot||!$('#fQuien').value.trim()) return toast('Completá el motivo y quién registra');
  if(!$('#bConf').checked) return toast('Marcá la confirmación de baja');
  const rec={...baseAdm('BAJA',e), motivo:mot, destino:$('#bDes').value.trim(), obs:$('#bObs').value.trim()};
  const x = await adminEnviar('baja', rec, ()=>!eqById(e.id));
  if(!x) return;
  okFin('EQUIPO DADO DE BAJA', `${esc(e.maq)} · ${esc(e.id)} · ${esc(mot)}`);
}

/* ----- NUEVO SITIO (y su QR) ----- */
function nuevoSitio(){
  const sups=[...new Set(SITIOS.map(s=>s.sup).filter(Boolean))].sort(), uns=[...new Set(EQ.map(e=>e.un).filter(Boolean))].sort();
  app.innerHTML=`<div class="card"><h2>🏢 Nuevo sitio / servicio</h2>
    <label>Tipo</label><select id="sTipo"><option>Servicio</option><option>Cuadrilla</option><option>Sitio de mantenimiento</option><option>Oficina</option></select>
    <label>Nombre (como se lo conoce en MVV)</label><input id="sNom" placeholder="Ej.: OCA - Hospital Rivadavia">
    <label>Supervisor</label><input id="sSup" list="dlSup"><datalist id="dlSup">${sups.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    <label>Unidad de negocio (opcional)</label><input id="sUn" list="dlUn"><datalist id="dlUn">${uns.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    <p class="note">El código de QR se asigna solo (S, C, M u O + número). Para cambiar el nombre o el supervisor más adelante, o desactivar un sitio, se edita la hoja “Sitios”.</p>
    <button class="btn big" id="btnGo" onclick="enviarSitio()">Crear sitio</button>
    <button class="btn ghost" onclick="panelVolver()">Volver al panel</button></div>`;
}
async function enviarSitio(){
  const nom=$('#sNom').value.trim(), sup=$('#sSup').value.trim();
  if(!nom||!sup) return toast('Completá nombre y supervisor');
  if(SITIOS.some(s=>s.srv.some(a=>a.toLowerCase()===nom.toLowerCase()))) return toast('Ya existe un sitio con ese nombre');
  const s = await adminEnviar('sitio', {tipo:$('#sTipo').value, nombre:nom, sup, un:$('#sUn').value.trim()}, ()=>SITIOS.find(x=>x.nombre===nom));
  if(!s) return;
  const link = location.origin + location.pathname + '?qr=' + s.cod;
  okFin('SITIO CREADO', `${esc(s.nombre)} · código ${esc(s.cod)}`,
    `<div class="card"><p>Link para la etiqueta QR del sitio:</p><div class="qrlink" id="qrL">${esc(link)}</div>
     <button class="btn sm sec" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(link)}').then(()=>toast('Link copiado'))">Copiar link</button>
     <p class="note">Ya se pueden dar de alta o trasladar equipos a este sitio.</p></div>`);
}

/* ---------------- Inicio ---------------- */
if(DEMO) $('#demo').classList.remove('hide');
api.flush();
go('home');
// Actualiza sitios/QR desde la hoja "Sitios" (si la etiqueta QR es de un sitio nuevo, lo reconoce al llegar la respuesta)
api.sitios().then(s=>{ SITIOS=s; if(QR_COD){ const n=s.find(g=>g.cod===QR_COD); const antes=QRG; if(n) QRG=n; if(n && !antes && VIEW==='home') go('home'); } });
</script>
