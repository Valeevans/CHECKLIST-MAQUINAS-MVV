<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Máquinas MVV · Check list semanal</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#15202b;--mut:#5d6b79;--line:#dce3ea;--pri:#0f5b4f;--pri2:#e3f1ee;--ok:#1b7f3a;--okbg:#e5f4ea;--bad:#c0261f;--badbg:#fde8e6;--warn:#a85d00;--warnbg:#fff2dc;--info:#1d5fa8;--infobg:#e6effa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;margin:0;flex:1;font-weight:650}
header small{display:block;font-weight:400;opacity:.8;font-size:12px}
header button{background:transparent;border:1px solid #ffffff70;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:650;cursor:pointer;margin-top:12px;background:var(--pri);color:#fff}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;margin:0;font-size:14px}
.big{font-size:20px;padding:22px}
.home .btn{text-align:left;padding:20px}
.home .btn span{display:block;font-weight:400;font-size:14px;opacity:.85;margin-top:2px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.itxt{margin-bottom:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.tag.crit{background:var(--badbg);color:var(--bad)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on[data-v="OK"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on[data-v="X"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on[data-v="N/A"]{background:#6b7280;border-color:#6b7280;color:#fff}
.obs{margin-top:8px}
.hide{display:none!important}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px;color:var(--ink)}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
.banner{border-radius:14px;padding:20px;text-align:center;margin-bottom:14px}
.banner b{display:block;font-size:24px;margin-bottom:4px}
.banner.ok{background:var(--okbg);color:var(--ok)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.warn{background:var(--warnbg);color:var(--warn)}
ul.fallas{margin:8px 0 0;padding-left:20px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--infobg);color:var(--info)}.b-mut{background:#eef1f4;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px}
.kpi span{font-size:12px;color:var(--mut)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.eq{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.eq .meta,.rec .meta{font-size:13px;color:var(--mut);margin-top:2px}
.eq.dis{opacity:.55;cursor:default}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.rec .top{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.rec .det{margin-top:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.rec .det p{margin:4px 0}
.alert{background:var(--badbg);border:1px solid #f3b8b3;color:var(--bad);border-radius:12px;padding:12px;margin-bottom:14px;font-size:15px}
.pend{background:var(--warnbg);border:1px solid #f2d39d;color:var(--warn);border-radius:12px;padding:12px;margin-bottom:14px;font-size:15px}
.note{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#eef1f4;border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#15202b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.demo{background:#fff8d6;color:#6b5400;font-size:13px;text-align:center;padding:6px}
.foot{text-align:center;font-size:12px;color:var(--mut);margin:20px 0}
.grp{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

  <button id="btnHome" class="hide" onclick="go('home')">Inicio</button>

const DEMO = !CONFIG.API_URL;
const $ = s => document.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoy = () => ymd(new Date());
const ahora = () => new Date().toISOString();
const fmtF = s => { const [y,m,d]=String(s).slice(0,10).split('-'); return `${d}/${m}`; };
const fmtFH = iso => { const d=new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = p => p + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
function lunes(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function semanaDe(fecha){ const [y,m,d]=fecha.split('-').map(Number); return ymd(lunes(new Date(y,m-1,d))); } // id de semana = fecha del lunes
function rangoSemana(lun){ const [y,m,d]=lun.split('-').map(Number); const a=new Date(y,m-1,d), b=new Date(y,m-1,d+6); return `${pad(a.getDate())}/${pad(a.getMonth()+1)} al ${pad(b.getDate())}/${pad(b.getMonth()+1)}`; }
const ls = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
function toast(m,ms=2800){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }

/* ---------------- API ---------------- */
const post = p => fetch(CONFIG.API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
const api = {
  async send(payload){
    if (DEMO){
      const db = ls.get('mvvmaq_demo', []);
      if (payload.action==='create') db.push({...payload.record, registrado: ahora()});
      if (payload.action==='validar') db.forEach(r=>{ if(payload.ids.includes(r.id)){ r.validadoPor=payload.validador; r.fechaValidacion=ahora(); }});
      ls.set('mvvmaq_demo', db); return true;
    }
    try{ await post(payload); return true; }
    catch(e){ const q=ls.get('mvvmaq_cola',[]); q.push(payload); ls.set('mvvmaq_cola',q); toast('Sin señal: quedó guardado y se envía cuando vuelva la conexión',4000); return false; }
  },
  async flush(){
    if (DEMO) return;
    const q=ls.get('mvvmaq_cola',[]); if(!q.length) return; const rest=[];
    for(const p of q){ try{ await post(p); }catch(e){ rest.push(p); } }
    ls.set('mvvmaq_cola',rest);
    if(q.length>rest.length) toast(`Se enviaron ${q.length-rest.length} registro(s) pendientes`);
  },
  async get(params){
    const u = CONFIG.API_URL + '?' + new URLSearchParams({...params, t:Date.now()});
    const j = await (await fetch(u)).json();
    if(!j.ok) throw new Error(j.error||'Error al leer datos');
    return j.data;
  },
  async equipos(){
    if (DEMO) return EQUIPOS_BASE;
    try{ const e=await api.get({action:'equipos'}); ls.set('mvvmaq_eqcache',e); return e; }
    catch(err){ return ls.get('mvvmaq_eqcache', EQUIPOS_BASE); }
  },
  async registros(key, desde, hasta){
    if (DEMO){ if(key!==CONFIG.DEMO_PIN) throw new Error('PIN incorrecto'); return ls.get('mvvmaq_demo',[]).filter(r=>r.fecha>=desde&&r.fecha<=hasta); }
    return api.get({action:'list', key, desde, hasta});
  },
  async estado(){
    if (DEMO) return calcEstado(EQUIPOS_BASE, ls.get('mvvmaq_demo',[]));
    try{ return await api.get({action:'estado'}); } catch(e){ return {}; }
  }
};
window.addEventListener('online', ()=>api.flush());

/* Estado actual por equipo a partir del historial (misma lógica que el Apps Script) */
function calcEstado(equipos, regs){
  const st={};
  equipos.forEach(e=>{ st[e.id] = /REPAR/i.test(e.est) ? {estado:'NO APTO', desde:'', motivo:'Inventario: '+e.est} : {estado:'APTO', desde:'', motivo:''}; });
  [...regs].sort((a,b)=>a.fechaHora.localeCompare(b.fechaHora)).forEach(r=>{
    const s = st[r.equipoId] || (st[r.equipoId]={});
    if(r.tipo==='CHECK SEMANAL'){ s.estado=r.resultado; s.desde=r.fechaHora; s.motivo=(r.fallasCriticas||[]).map(f=>f.item).join(', '); s.ultimoCheck=r.fecha; }
    if(r.tipo==='REPORTE DE FALLA'){ s.estado='NO APTO'; s.desde=r.fechaHora; s.motivo=r.falla; }
    if(r.tipo==='LIBERACIÓN'){ s.estado='APTO'; s.desde=r.fechaHora; s.motivo=''; }
  });
  return st;
}

    <div class="row">
      <div><label>Supervisor</label><select id="fSup"><option value="">Todos</option>${sups.map(s=>`<option ${s===u.sup?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
      <div><label>Servicio / sede</label><select id="fSrv"></select></div>
    </div>
    <label>Buscar (N° de serie, máquina o modelo)</label><input id="fQ" placeholder="ej. 000012 o lustradora">
  </div>
  <div id="lst"></div>`;
  const fSup=$('#fSup'), fSrv=$('#fSrv'), fQ=$('#fQ');
  const semAct = semanaDe(hoy());
  function cargarSrv(){
    const srvs=[...new Set(EQ.filter(e=>!fSup.value||e.sup===fSup.value).map(e=>e.srv))].sort((a,b)=>a.localeCompare(b));
    fSrv.innerHTML = `<option value="">Todos</option>` + srvs.map(s=>`<option ${s===u.srv?'selected':''}>${esc(s)}</option>`).join('');
  }
  function render(){
    const q=fQ.value.trim().toLowerCase();
    let l = EQ.filter(e=>(!fSup.value||e.sup===fSup.value)&&(!fSrv.value||e.srv===fSrv.value)&&(!q||(e.id+' '+e.maq+' '+e.mod+' '+e.srv).toLowerCase().includes(q)));
    if(modo==='liberar') l = l.filter(e=>(ST[e.id]||{}).estado==='NO APTO');
    const html = l.map(e=>{
      const s=ST[e.id]||{estado:'APTO'};
      const hecho = s.ultimoCheck && semanaDe(s.ultimoCheck)===semAct;
      const bloq = (modo==='check'||modo==='falla') && s.estado==='NO APTO';
      const extra = modo==='check' ? (hecho?`<span class="badge b-ok">Check de esta semana ✓</span>`:`<span class="badge b-warn">Check pendiente</span>`) : '';
      return `<div class="eq ${bloq?'dis':''}" data-id="${esc(e.id)}" data-bloq="${bloq?1:''}"><div>${fichaEq(e)}${bloq?`<div class="meta" style="color:var(--bad)">Fuera de servicio: ${esc(s.motivo||'')}. Usá “Reparación y liberación”.</div>`:''}</div><div style="text-align:right">${badge(s.estado)}<br>${extra}</div></div>`;
    }).join('');
    $('#lst').innerHTML = html || `<div class="card note">${modo==='liberar'?'No hay equipos NO APTOS con este filtro.':'No hay equipos con este filtro.'}</div>`;
    $('#lst').querySelectorAll('.eq').forEach(el=>el.onclick=()=>{
      if(el.dataset.bloq) return toast('Este equipo está fuera de servicio');
      const e=eqById(el.dataset.id); ls.set('mvvmaq_ultimo',{...ls.get('mvvmaq_ultimo',{}),sup:fSup.value,srv:fSrv.value});
      go(modo, e);
    });
  }
  fSup.onchange=()=>{ u.srv=''; cargarSrv(); render(); };
  fSrv.onchange=render; fQ.oninput=render;
  cargarSrv(); render();
}

/* ---------------- CHECK SEMANAL ---------------- */
let ans={};
function itemHTML(it,crit){
  return `<div class="item" data-id="${it.id}">
    <div class="itxt">${crit?'<span class="tag crit">CRÍTICO</span>':''}${esc(it.t)}</div>
    <div class="seg"><button type="button" data-v="OK">OK</button><button type="button" data-v="X">X (falla)</button>${it.na?'<button type="button" data-v="N/A">N/A</button>':''}</div>
    <textarea class="obs hide" placeholder="Describí la falla"></textarea></div>`;
}
function referenteInput(){ return `<label>Referente de servicio (tu nombre)</label><input id="fRef" value="${esc(ls.get('mvvmaq_ultimo',{}).ref||'')}" autocomplete="name">`; }
function check(e){
  ans={};
  app.innerHTML = `
  <div class="card"><h2>Check semanal</h2>${fichaEq(e)}${referenteInput()}</div>
  <div class="card"><h2>Ítems críticos</h2><p class="note">Con uno solo en <b>X</b> el equipo queda <b>NO APTO</b> y se retira de servicio.</p>${CONFIG.CRITICOS.map(i=>itemHTML(i,true)).join('')}</div>
  <div class="card"><h2>Otros controles</h2><p class="note">Se registran como observación; el equipo puede seguir operando.</p>${CONFIG.MENORES.map(i=>itemHTML(i,false)).join('')}</div>
  <div class="card"><label>Observaciones / mantenimiento requerido (opcional)</label><textarea id="fObs"></textarea>
    <label class="check"><input type="checkbox" id="fDecl"> Declaro que realicé el control del equipo y que la información es verdadera.</label>
    <button class="btn big" onclick="enviarCheck()">Evaluar y registrar</button></div>`;
  window._eq=e;
  app.querySelectorAll('.item').forEach(el=>{
    const id=el.dataset.id;
    el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
      el.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      ans[id]={v:b.dataset.v,obs:(ans[id]||{}).obs||''};
      el.querySelector('.obs').classList.toggle('hide', b.dataset.v!=='X');
    });
    el.querySelector('.obs').oninput=ev=>{ if(ans[id]) ans[id].obs=ev.target.value; };
  });
}
function base(e, tipo){
  const ref=$('#fRef').value.trim();
  ls.set('mvvmaq_ultimo',{...ls.get('mvvmaq_ultimo',{}),ref});
  const f=hoy();
  return {id:uid(tipo==='CHECK SEMANAL'?'CK':tipo==='LIBERACIÓN'?'LB':'FA'), tipo, fecha:f, semana:semanaDe(f), fechaHora:ahora(),
    equipoId:e.id, maquina:e.maq, modelo:e.mod, servicio:e.srv, supervisor:e.sup, referente:ref};
}
async function enviarCheck(){
  const e=window._eq;
  if(!$('#fRef').value.trim()) return toast('Completá tu nombre');
  const todos=[...CONFIG.CRITICOS,...CONFIG.MENORES];
  const falt=todos.filter(i=>!ans[i.id]);
  if(falt.length){ toast(`Faltan ${falt.length} ítem(s) por responder`); document.querySelector(`.item[data-id="${falt[0].id}"]`).scrollIntoView({behavior:'smooth',block:'center'}); return; }
  const sinObs=todos.filter(i=>ans[i.id].v==='X'&&!ans[i.id].obs.trim());
  if(sinObs.length){ toast('Describí cada falla marcada con X'); document.querySelector(`.item[data-id="${sinObs[0].id}"] .obs`).focus(); return; }
  if(!$('#fDecl').checked) return toast('Marcá la declaración antes de registrar');
  const mk=l=>l.filter(i=>ans[i.id].v==='X').map(i=>({item:i.t,obs:ans[i.id].obs.trim()}));
  const fallasCriticas=mk(CONFIG.CRITICOS), observaciones=mk(CONFIG.MENORES);
  const resultado = fallasCriticas.length?'NO APTO':(observaciones.length?'APTO CON OBSERVACIONES':'APTO');
  const respuestas={}; todos.forEach(i=>respuestas[i.t]=ans[i.id].v);
  const rec={...base(e,'CHECK SEMANAL'), resultado, fallasCriticas, observaciones, obsGenerales:$('#fObs').value.trim(), respuestas};
  await api.send({action:'create',record:rec});
  if(resultado==='NO APTO'){
    app.innerHTML=`<div class="banner bad"><b>⛔ EQUIPO NO APTO</b>${esc(e.maq)} · ${esc(e.id)}</div>
    <div class="card"><h2>Fallas críticas</h2><ul class="fallas">${fallasCriticas.map(f=>`<li><b>${esc(f.item)}</b><br>${esc(f.obs)}</li>`).join('')}</ul>
    <p><b>Retirá el equipo de servicio, desenchufalo y señalizalo “NO USAR”.</b> Avisá a tu Supervisor. No puede usarse hasta su reparación y liberación.</p>
    <p class="note">El Supervisor ya lo ve en el panel.</p></div>
    <button class="btn ok" onclick="go('liberar', window._eq)">Se reparó en el momento → registrar reparación y liberación</button>
    <button class="btn ghost" onclick="go('home')">Volver al inicio</button>`;
  } else {
    app.innerHTML=`<div class="banner ${resultado==='APTO'?'ok':'warn'}"><b>✔ EQUIPO APTO PARA OPERAR</b>${esc(e.maq)} · ${esc(resultado)}</div>
    ${observaciones.length?`<div class="card"><h2>Observaciones registradas</h2><ul class="fallas">${observaciones.map(f=>`<li><b>${esc(f.item)}</b>: ${esc(f.obs)}</li>`).join('')}</ul></div>`:''}
    <p class="note" style="text-align:center">Registro ${esc(rec.id)} · ${fmtFH(rec.fechaHora)}</p>
    <button class="btn" onclick="go('elegir','check')">Controlar otro equipo</button><button class="btn ghost" onclick="go('home')">Inicio</button>`;
  }
}

/* ---------------- REPORTE DE FALLA ---------------- */
function falla(e){
  window._eq=e;
  app.innerHTML=`<div class="card"><h2>Reportar falla</h2>${fichaEq(e)}${referenteInput()}
    <label>¿Qué falla tiene?</label><textarea id="fFalla" placeholder="Ej.: cable cortado cerca del enchufe, no arranca, pierde agua…"></textarea>
    <p class="note">Al registrar, el equipo queda <b>NO APTO</b> y fuera de servicio hasta su reparación y liberación.</p>
    <button class="btn bad big" onclick="enviarFalla()">Registrar falla y retirar de servicio</button></div>`;
}
async function enviarFalla(){
  const e=window._eq;
  if(!$('#fRef').value.trim()||!$('#fFalla').value.trim()) return toast('Completá tu nombre y la falla');
  const rec={...base(e,'REPORTE DE FALLA'), resultado:'NO APTO', falla:$('#fFalla').value.trim()};
  await api.send({action:'create',record:rec});
  app.innerHTML=`<div class="banner bad"><b>Falla registrada · EQUIPO NO APTO</b>${esc(e.maq)} · ${esc(e.id)}</div>
  <div class="card"><p><b>Retirá el equipo de servicio, desenchufalo y señalizalo “NO USAR”.</b> El Supervisor ya lo ve en el panel.</p></div>
  <button class="btn" onclick="go('home')">Volver al inicio</button>`;
}

/* ---------------- REPARACIÓN Y LIBERACIÓN ---------------- */
function liberar(e){
  window._eq=e; const s=ST[e.id]||{};
  app.innerHTML=`<div class="card"><h2>Reparación y liberación</h2>${fichaEq(e)}
    ${s.motivo?`<p class="note">Motivo de NO APTO: <b>${esc(s.motivo)}</b>${s.desde?` (desde ${fmtFH(s.desde)})`:''}</p>`:''}
    ${referenteInput()}
    <label>¿Qué se hizo para repararlo?</label><textarea id="fTrab"></textarea>
    <div class="row"><div><label>Reparó (técnico / proveedor)</label><input id="fProv"></div><div><label>OT / factura N° (opcional)</label><input id="fOT"></div></div>
    <label class="check"><input type="checkbox" id="fPrueba"> Se hizo la prueba de funcionamiento y el equipo funciona correctamente.</label>
    <label>Liberó (Supervisor o Jefe Operativo)</label><input id="fLib">
    <button class="btn ok big" onclick="enviarLib()">Registrar y liberar el equipo</button></div>`;
}
async function enviarLib(){
  const e=window._eq;
  const trab=$('#fTrab').value.trim(), prov=$('#fProv').value.trim(), lib=$('#fLib').value.trim();
  if(!$('#fRef').value.trim()||!trab||!prov||!lib) return toast('Completá nombre, trabajo realizado, quién reparó y quién liberó');
  if(!$('#fPrueba').checked) return toast('Falta confirmar la prueba de funcionamiento');
  const s=ST[e.id]||{};
  const rec={...base(e,'LIBERACIÓN'), resultado:'APTO', trabajo:trab, reparo:prov, ot:$('#fOT').value.trim(), libero:lib, motivoAnterior:s.motivo||'', noAptoDesde:s.desde||''};
  await api.send({action:'create',record:rec});
  app.innerHTML=`<div class="banner ok"><b>✔ EQUIPO LIBERADO</b>${esc(e.maq)} · ${esc(e.id)} vuelve a operar</div>
  <p class="note" style="text-align:center">Registro ${esc(rec.id)} · ${fmtFH(rec.fechaHora)}</p><button class="btn" onclick="go('home')">Volver al inicio</button>`;
}

/* ---------------- PANEL ---------------- */
let pKey='', pSem=semanaDe(hoy()), pSup='', pData=[], pOpen=new Set();
function panel(){
  if(!pKey){
    app.innerHTML=`<div class="card"><h2>Panel de máquinas y equipos</h2><label>PIN de acceso</label><input id="fPin" type="password" inputmode="numeric">
    <button class="btn" onclick="pKey=$('#fPin').value;panelCargar()">Ingresar</button>${DEMO?`<p class="note">Demo: PIN ${CONFIG.DEMO_PIN}</p>`:''}</div>`;
    return;
  }
  panelCargar();
}
async function panelCargar(){
  app.innerHTML=`<div class="card note">Cargando…</div>`;
  const d=new Date(); d.setDate(d.getDate()-120);
  try{ [EQ, ST, pData] = await Promise.all([api.equipos(), api.estado(), api.registros(pKey, ymd(d), hoy())]); }
  catch(e){ toast(e.message); pKey=''; return panel(); }
  panelRender();
}
function panelRender(){
  const eqF = EQ.filter(e=>!pSup||e.sup===pSup);
  const ids = new Set(eqF.map(e=>e.id));
  const regs = pData.filter(r=>ids.has(r.equipoId)).sort((a,b)=>b.fechaHora.localeCompare(a.fechaHora));
  const regSem = regs.filter(r=>r.semana===pSem || semanaDe(r.fecha)===pSem);
  const checksSem = regSem.filter(r=>r.tipo==='CHECK SEMANAL');
  const conCheck = new Set(checksSem.map(r=>r.equipoId));
  const noApto = eqF.filter(e=>(ST[e.id]||{}).estado==='NO APTO');
  const activos = eqF.filter(e=>!noApto.includes(e));
  const pendientes = activos.filter(e=>!conCheck.has(e.id));
  const cumpl = activos.length ? Math.round(100*activos.filter(e=>conCheck.has(e.id)).length/activos.length) : 0;
  const sinValidar = regs.filter(r=>r.tipo==='CHECK SEMANAL' && !r.validadoPor);
  const fallasSem = regSem.filter(r=>r.resultado==='NO APTO').length;
  // fallas repetidas: 2+ NO APTO en 120 días
  const cnt={}; regs.filter(r=>r.resultado==='NO APTO').forEach(r=>cnt[r.equipoId]=(cnt[r.equipoId]||0)+1);
  const repetidas = Object.entries(cnt).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]);
  // cumplimiento por supervisor y servicio
  const porSup={}; EQ.filter(e=>(ST[e.id]||{}).estado!=='NO APTO').forEach(e=>{ const k=e.sup; porSup[k]=porSup[k]||{t:0,c:0}; porSup[k].t++; if(pData.some(r=>r.tipo==='CHECK SEMANAL'&&r.equipoId===e.id&&(r.semana===pSem||semanaDe(r.fecha)===pSem))) porSup[k].c++; });
  const sups=[...new Set(EQ.map(e=>e.sup))].sort();
  const semanas=[]; { let l=new Date(pSem+'T00:00:00'); const act=lunes(new Date()); for(let i=0;i<12;i++){ const x=new Date(act); x.setDate(x.getDate()-7*i); semanas.push(ymd(x)); } }
  const kpi=(n,t,c='')=>`<div class="kpi ${c}"><b>${n}</b><span>${t}</span></div>`;
  const grp = l => { const g={}; l.forEach(e=>{ (g[e.srv]=g[e.srv]||[]).push(e); }); return Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0])); };
  app.innerHTML=`
  <div class="card"><div class="row">
    <div><label>Semana</label><select id="pSem">${semanas.map(s=>`<option value="${s}" ${s===pSem?'selected':''}>${rangoSemana(s)}${s===semanaDe(hoy())?' (actual)':''}</option>`).join('')}</select></div>
    <div><label>Supervisor</label><select id="pSup"><option value="">Todos</option>${sups.map(s=>`<option ${s===pSup?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
  </div>
  <div class="row"><button class="btn sec" onclick="panelCargar()">Actualizar</button><button class="btn ghost" onclick="exportarCSV()">Descargar CSV</button></div></div>
  <div class="kpis">
    ${kpi(cumpl+'%','Cumplimiento check semanal',cumpl>=90?'ok':cumpl>=70?'warn':'bad')}
    ${kpi(conCheck.size+' / '+activos.length,'Equipos controlados')}
    ${kpi(pendientes.length,'Pendientes esta semana','warn')}
    ${kpi(noApto.length,'NO APTOS / fuera de servicio','bad')}
    ${kpi(fallasSem,'Fallas críticas en la semana','bad')}
    ${kpi(sinValidar.length,'Checks sin validar','warn')}
  </div>
  ${noApto.length?`<div class="card"><h2 style="color:var(--bad)">⛔ Fuera de servicio (${noApto.length})</h2>
    ${noApto.map(e=>{const s=ST[e.id]||{};return `<div class="eq" style="cursor:default"><div>${fichaEq(e)}<div class="meta" style="color:var(--bad)">${esc(s.motivo||'')}${s.desde?' · desde '+fmtFH(s.desde):''}</div></div>${badge('NO APTO')}</div>`;}).join('')}</div>`:''}
  ${!pSup?`<div class="card"><h2>Cumplimiento por supervisor</h2><table><tr><th>Supervisor</th><th class="n">Controlados</th><th style="width:30%"></th></tr>
    ${Object.entries(porSup).sort().map(([k,v])=>{const p=v.t?Math.round(100*v.c/v.t):0;return `<tr><td>${esc(k)}</td><td class="n">${v.c} / ${v.t} · ${p}%</td><td><div class="bar"><i style="width:${p}%"></i></div></td></tr>`;}).join('')}</table></div>`:''}
  <div class="card"><h2>Checks pendientes de validación (${sinValidar.length})</h2>
    ${sinValidar.length?`<label>Validado por</label><input id="pVal" value="${esc(ls.get('mvvmaq_validador',''))}" placeholder="Tu nombre (Supervisor / Jefe Operativo)">
    <button class="btn ok" onclick="validar(${JSON.stringify(sinValidar.map(r=>r.id)).replace(/"/g,'&quot;')})">Validar los ${sinValidar.length} checks${pSup?' de '+esc(pSup):''}</button>
    <p class="note">Revisá el detalle en “Registros” antes de validar. También podés validar uno por uno.</p>`:'<p class="note">No hay checks pendientes de validar.</p>'}</div>
  <div class="card"><h2>Sin check en la semana (${pendientes.length})</h2>
    ${pendientes.length?grp(pendientes).map(([srv,l])=>`<div class="grp">${esc(srv)} · ${esc(l[0].sup)}</div>${l.map(e=>`<div class="meta">• ${esc(e.maq)} ${esc(e.mod||'')} — ${esc(e.id)}</div>`).join('')}`).join(''):'<p class="note">Todos los equipos activos tienen su check. 👏</p>'}</div>
  ${repetidas.length?`<div class="card"><h2>Fallas repetidas (últimos 120 días)</h2><p class="note">Equipos con 2 o más NO APTO: evaluar reparación de fondo o reemplazo.</p>
    <table><tr><th>Equipo</th><th>Servicio</th><th class="n">NO APTO</th></tr>${repetidas.map(([id,n])=>{const e=eqById(id)||{};return `<tr><td>${esc(e.maq||'')} · ${esc(id)}</td><td>${esc(e.srv||'')}</td><td class="n">${n}</td></tr>`;}).join('')}</table></div>`:''}
  <div class="card"><h2>Registros de la semana (${regSem.length})</h2>${regSem.length?regSem.map(recHTML).join(''):'<p class="note">Sin registros en la semana.</p>'}</div>`;
  $('#pSem').onchange=e=>{ pSem=e.target.value; panelRender(); };
  $('#pSup').onchange=e=>{ pSup=e.target.value; panelRender(); };
  app.querySelectorAll('.rec .top').forEach(el=>el.onclick=()=>{ const id=el.parentNode.dataset.id; pOpen.has(id)?pOpen.delete(id):pOpen.add(id); panelRender(); });
  app.querySelectorAll('[data-val]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); validar([b.dataset.val]); });
}
function recHTML(r){
  const open=pOpen.has(r.id); let det='';
  if(open){
    const li=(t,l)=>l&&l.length?`<p><b>${t}:</b></p><ul class="fallas">${l.map(f=>`<li>${esc(f.item)}: ${esc(f.obs)}</li>`).join('')}</ul>`:'';
    det=`<div class="det"><p><b>Referente:</b> ${esc(r.referente)} · <b>Servicio:</b> ${esc(r.servicio)}</p>
      ${li('Fallas críticas',r.fallasCriticas)}${li('Observaciones',r.observaciones)}
      ${r.obsGenerales?`<p><b>Obs. generales:</b> ${esc(r.obsGenerales)}</p>`:''}
      ${r.falla?`<p><b>Falla:</b> ${esc(r.falla)}</p>`:''}
      ${r.trabajo?`<p><b>Trabajo:</b> ${esc(r.trabajo)} · <b>Reparó:</b> ${esc(r.reparo)}${r.ot?' · OT '+esc(r.ot):''} · <b>Liberó:</b> ${esc(r.libero)}</p>`:''}
      ${r.tipo==='CHECK SEMANAL'?(r.validadoPor?`<p class="note">Validado por ${esc(r.validadoPor)} · ${fmtFH(r.fechaValidacion)}</p>`:`<button class="btn sm ok" data-val="${esc(r.id)}">Validar este check</button>`):''}
      <p class="note">ID ${esc(r.id)}</p></div>`;
  }
  const ico={'CHECK SEMANAL':'🧰','REPORTE DE FALLA':'⚠️','LIBERACIÓN':'🔧'}[r.tipo]||'';
  const val = r.tipo==='CHECK SEMANAL' ? (r.validadoPor?' <span class="badge b-mut">Validado</span>':' <span class="badge b-warn">Sin validar</span>') : '';
  return `<div class="rec" data-id="${esc(r.id)}"><div class="top"><div>${ico} <b>${esc(r.maquina)}</b> · ${esc(r.equipoId)}<div class="meta">${esc(r.tipo)} · ${fmtFH(r.fechaHora)} · ${esc(r.servicio)}${open?'':' · tocá para ver'}</div></div><div style="text-align:right">${badge(r.resultado)}${val}</div></div>${det}</div>`;
}
async function validar(ids){
  const inp=$('#pVal'); const v=(inp&&inp.value.trim())||ls.get('mvvmaq_validador','');
  if(!v){ toast('Escribí tu nombre en “Validado por”'); if(inp) inp.focus(); return; }
  ls.set('mvvmaq_validador',v);
  await api.send({action:'validar', key:pKey, ids, validador:v});
  const t=ahora(); pData.forEach(r=>{ if(ids.includes(r.id)){ r.validadoPor=v; r.fechaValidacion=t; }});
  toast(`${ids.length} check(s) validado(s)`); panelRender();
}
function exportarCSV(){
  const cols=['id','tipo','fecha','semana','equipo','maquina','servicio','supervisor','referente','resultado','fallas_criticas','observaciones','falla','trabajo','reparo','libero','validado_por'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const j=l=>(l||[]).map(f=>f.item+': '+f.obs).join(' | ');
  const rows=pData.map(r=>[r.id,r.tipo,r.fecha,r.semana,r.equipoId,r.maquina,r.servicio,r.supervisor,r.referente,r.resultado,j(r.fallasCriticas),j(r.observaciones),r.falla,r.trabajo,r.reparo,r.libero,r.validadoPor].map(q).join(';'));
  const blob=new Blob(['﻿'+cols.join(';')+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${CONFIG.CODIGO}_${hoy()}.csv`; a.click();
}

/* ---------------- Inicio ---------------- */
if(DEMO) $('#demo').classList.remove('hide');
api.flush();
go('home');
